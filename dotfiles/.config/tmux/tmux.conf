# tmux — keeps a session running on the machine, so you can drop the
# connection (or the phone) and pick it up exactly where you left it.
#
#   sys ssh mini      connect and attach in one go
#   ssh mini          the same: every interactive ssh login attaches
#   Ctrl-b d             detach and leave it running
#
# Which session a login gets is decided by ~/.config/tmux/attach.
#
# Prefix stays Ctrl-b: it is what every guide assumes.

# screen-256color rather than tmux-256color: the latter's description is not
# installed on a minimal Ubuntu, and tmux then refuses to start.
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm*:Tc,ghostty:Tc"

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# No wait after Escape — otherwise vim and friends feel sticky.
set -sg escape-time 0
# Ask the terminal to copy, so a selection reaches the Mac's clipboard over ssh.
set -g set-clipboard on
set -g focus-events on

# Sessions outlive their last window rather than closing the moment one exits.
set -g detach-on-destroy off

# Status line: which machine, which session, and the time. Quiet colours.
set -g status-style "bg=default fg=colour245"
set -g status-left "#[fg=colour109,bold] #h #[fg=colour245]#S "
set -g status-left-length 40
set -g status-right "#[fg=colour245]%a %d %b  %H:%M "
set -g window-status-current-style "fg=colour223,bold"

# Split panes with the keys the symbols suggest, in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Reload this file.
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
